body { margin: 0; background: #f8f5ef; color: #1f1f1c; color-scheme: light; }

}

}
.preview-context-actions {
  display: flex;
  align-items: center;
  flex: 0 0 auto;
  gap: 20px;
}
.preview-context-back,
.preview-context-use {
  display: inline-flex;
  align-items: center;
  justify-content: center;

.preview-context svg {

.preview-context-back { color: #c2c5cc; }
.preview-context-back:hover { color: #ffffff; }
.preview-context-use { color: #24262b; }

/* Shared interaction geometry; each demonstration supplies its own material palette. */
.pd-choice,.pd-stepper{--control-bg:#fff;--control-ink:#344650;--control-line:#d6dfe3;--control-accent:#23879a;--control-hover:#eff6f7;--control-radius:5px;--control-shadow:0 12px 32px #172c3a20;color:var(--control-ink);font:inherit}
.pd-choice{display:block;position:relative;width:100%;text-align:left}
.pd-choice>input[type=hidden]{display:none!important}
.demo-root .pd-choice-trigger,.stock-page .pd-choice-trigger{appearance:none;width:100%;min-height:44px;padding:10px 12px;margin:0;display:flex;align-items:center;justify-content:space-between;gap:14px;background:var(--control-bg);color:var(--control-ink);border:1px solid var(--control-line);border-radius:var(--control-radius);font:inherit;text-align:left;line-height:1.5;box-shadow:none;cursor:pointer}
.pd-choice-trigger>[data-choice-label]{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pd-choice-trigger>svg{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.5;transition:transform .15s}
.pd-choice-trigger[aria-expanded=true]>svg{transform:rotate(180deg)}
.demo-root .pd-choice-trigger:hover,.demo-root .pd-choice-trigger[aria-expanded=true]{border-color:var(--control-accent);background:var(--control-hover)}
.demo-root .pd-choice-trigger:focus-visible{outline:2px solid var(--control-accent);outline-offset:3px}
.pd-choice-list{box-sizing:border-box;z-index:1000;display:block;overflow-y:auto;overscroll-behavior:contain;padding:5px;background:var(--control-bg);color:var(--control-ink);border:1px solid var(--control-line);border-radius:var(--control-radius);box-shadow:var(--control-shadow);font:inherit;line-height:1.5;scroll-padding:5px}
.pd-choice-list[hidden]{display:none!important}

.pd-swatch{width:24px;height:28px;flex:none;background:#f5f0df;border:1px solid #d6cfbd}

.pd-stepper{display:flex!important;align-items:stretch;width:100%;border:1px solid var(--control-line);border-radius:var(--control-radius);background:var(--control-bg);overflow:hidden}
.pd-stepper:focus-within{outline:2px solid var(--control-accent);outline-offset:3px}

  <script>(function initializePageDesignDemo() {

  function closeDialog(dialog) { if (dialog?.open) dialog.close(); }
  function bindDialogs(root) {
    root.querySelectorAll('[data-demo-open]').forEach(button => button.addEventListener('click', () => openDialog(root.querySelector(button.dataset.demoOpen), button)));
    root.querySelectorAll('[data-demo-close]').forEach(button => button.addEventListener('click', () => closeDialog(button.closest('dialog'))));
    root.querySelectorAll('dialog').forEach(dialog => {
      dialog.addEventListener('close', () => { const opener = openers.get(dialog); if (opener?.isConnected) opener.focus(); });
      dialog.addEventListener('click', event => { const rect = dialog.getBoundingClientRect(); if (event.target === dialog && (event.clientX < rect.left || event.clientX > rect.right || event.clientY < rect.top || event.clientY > rect.bottom)) closeDialog(dialog); });

  }

  function toast(root, message) {
    let node = root.querySelector('.demo-toast');
    if (!node) { node = document.createElement('div'); node.className = 'demo-toast'; node.setAttribute('role','status'); node.setAttribute('aria-live','polite'); root.appendChild(node); }

<script type="application/json" data-s24-data>[{"title":"山川记","sub":"溪山有信，来去无声","seal":"卷一","paragraphs":["青岚镇的河道从西山脚下转了一个弯。春水涨起时，河心的石阶只露出最上一级，老人便知道，该把门前晾着的竹篮收进屋了。","沿河向北，有一条不记在新地图上的小路。路的尽头是旧渡口，木桩被水磨得发亮。往来的人早已换乘车船，岸边那株柳树仍照旧年年垂下枝条。","此地的山不高，却层层有路。采茶人清早上山，午后携一身草木气归来。若问哪一处看云最好，人人都有一块舍不得说出的石头。"]},{"title":"街巷录","sub":"一条旧街，许多日常","seal":"卷二","paragraphs":["东街铺着深浅不一的石板。雨后，石板缝里有细小的青苔。修伞匠坐在檐下，把一根断了的伞骨接好，再缓缓撑开，像替一朵花整理花瓣。","旧书铺的门框上留着几道刻痕，是店主给孩子量身高时留下的。孩子长大离乡，书铺仍在。每逢有人来买旧地图，店主总会多讲几句地图之外的路。","临近黄昏，街尾的面摊先亮起灯。搬桌子的人，送葱的人，牵着孩子等一碗热汤的人，彼此不用寒暄太久。街巷的名字，便这样一日一日地被人记住。"]},{"title":"岁时笺","sub":"循着节气，记下小事","seal":"卷三","paragraphs":["惊蛰过后，家家把种子从柜子深处取出。豆种留在蓝布袋里，菜籽装在旧信封中。信封上写着去年的雨水和今年想试的一小块地。","立夏那日，邻里互赠新采的豆子。孩子把豆荚数了又数，数着数着便忘了数目。院里的风把饭菜气吹出很远，晚饭总比平日坐得久一些。","到霜降时，河岸安静下来。人们修整竹篱，洗净晒了一季的陶罐。冬日尚未到来，一年的忙碌已经慢慢收拢，在屋檐下留下松软的空白。"]}]</script><script>(function init() {

 function draw(){ const chapter=data[current];$('[data-s24-seal]').textContent=chapter.seal;$('[data-s24-title]').textContent=chapter.title;$('[data-s24-sub]').textContent=chapter.sub;$('[data-s24-paragraphs]').innerHTML=chapter.paragraphs.map((text,i)=>`<section id="s24-paragraph-${i}" class="s24-paragraph"><span class="s24-p-num">〇${i+1}</span><p>${D.escapeHtml(text)}</p><button type="button" data-s24-annotate="${i}" aria-label="为第${i+1}段添加批注">批注 <span aria-hidden="true">＋</span></button></section>`).join('');root.querySelectorAll('[data-s24-chapter]').forEach(button=>{const active=+button.dataset.s24Chapter===current;button.setAttribute('aria-pressed',String(active));});$('[data-s24-chapter-count]').textContent=`${current+1} / ${data.length}`;updateProgress(); }
 function updateProgress(){const rect=$('[data-s24-article]').getBoundingClientRect(),percent=Math.max(0,Math.min(100,Math.round((innerHeight-rect.top)/Math.max(1,rect.height)*100)));$('[data-s24-progress]').value=percent;$('[data-s24-progress-label]').textContent=`${percent}%`;}
 root.querySelectorAll('[data-s24-chapter]').forEach(button=>button.addEventListener('click',()=>{current=+button.dataset.s24Chapter;draw();$('[data-s24-article]').scrollIntoView({block:'start'});}));
 $('[data-s24-paragraphs]').addEventListener('click',event=>{const button=event.target.closest('[data-s24-annotate]');if(!button)return;selectedParagraph=+button.dataset.s24Annotate;$('[data-s24-quote]').textContent=data[current].paragraphs[selectedParagraph];$('[data-s24-note-form]').reset();$('[data-s24-note-form] textarea').removeAttribute('aria-invalid');$('#s24-note-error').textContent='';D.openDialog($('#s24-note-dialog'),button);});
 function drawNotes(){ $('[data-s24-note-count]').textContent=`${notes.length} 则`;$('[data-s24-empty]').hidden=notes.length>0;$('[data-s24-note-list]').innerHTML=notes.map((note,i)=>`<article><span>${D.escapeHtml(data[note.chapter].title)} · 第${note.paragraph+1}段</span><p>${D.escapeHtml(note.text)}</p><button type="button" data-s24-return="${i}">返回原文 ↗</button><button type="button" data-s24-remove="${i}" aria-label="移除第${i+1}则批注">移除</button></article>`).join(''); }
 D.wireForm($('[data-s24-note-form]'),form=>{notes.push({chapter:current,paragraph:selectedParagraph,text:String(form.get('note')).trim()});drawNotes();D.closeDialog($('#s24-note-dialog'));D.toast(root,'已收入本次摘录册。');});
 $('[data-s24-note-list]').addEventListener('click',event=>{const back=event.target.closest('[data-s24-return]'),remove=event.target.closest('[data-s24-remove]');if(back){const note=notes[+back.dataset.s24Return];current=note.chapter;draw();const paragraph=$(`#s24-paragraph-${note.paragraph}`);paragraph.scrollIntoView({block:'center'});paragraph.classList.add('is-marked');paragraph.querySelector('[data-s24-annotate]').focus({preventScroll:true});}if(remove){const index=+remove.dataset.s24Remove;notes.splice(index,1);drawNotes();const remaining=root.querySelectorAll('[data-s24-return]');const next=remaining[Math.min(index,remaining.length-1)]||$('#s24-notebook');next.setAttribute('tabindex','-1');next.focus();}});
 addEventListener('scroll',updateProgress,{passive:true});addEventListener('pagehide',()=>removeEventListener('scroll',updateProgress),{once:true});draw();drawNotes();

      function sync() { const i=selectedIndex(); box.querySelector('[data-choice-label]').textContent=options[i].querySelector('span').textContent; options.forEach((option,n)=>option.setAttribute('aria-selected',String(n===i))); }
      function choose(i) { if(!enabled(i))return;input.value=options[i].dataset.value;sync();close();trigger.focus();input.dispatchEvent(new Event('input',{bubbles:true}));input.dispatchEvent(new Event('change',{bubbles:true})); }
